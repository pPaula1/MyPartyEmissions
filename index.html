<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Party Emissions</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212f;
      --muted: #5b6472;
      --paper: #f5f7f2;
      --panel: rgba(255, 255, 255, 0.9);
      --green: #1b8f6a;
      --blue: #315f99;
      --orange: #d46d2c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(rgba(245, 247, 242, 0.72), rgba(245, 247, 242, 0.9)),
        url("data:image/svg+xml,%3Csvg width='1200' height='800' viewBox='0 0 1200 800' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='1200' height='800' fill='%23e8efe8'/%3E%3Cpath d='M0 620C160 560 300 670 460 600s275-245 458-196 230 220 282 174v222H0z' fill='%2397c7b1'/%3E%3Cpath d='M0 508c133-94 254-57 372-98s216-170 376-125 274 159 452 111v404H0z' fill='%2382a9cf' opacity='.72'/%3E%3Ccircle cx='960' cy='170' r='92' fill='%23f2b46f' opacity='.8'/%3E%3C/svg%3E");
      background-size: cover;
      background-position: center;
    }

    main {
      min-height: calc(100vh - 64px);
      display: grid;
      align-items: center;
      padding: 32px 20px;
    }

    .hero {
      width: min(960px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 28px;
    }

    .hero-copy {
      max-width: 760px;
      padding: 32px;
      background: var(--panel);
      border: 1px solid rgba(24, 33, 47, 0.12);
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(24, 33, 47, 0.16);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.2rem, 6vw, 4.8rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      max-width: 620px;
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.55;
    }

    .authors {
      margin-bottom: 28px;
      color: var(--muted);
      font-style: italic;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 12px 18px;
      border-radius: 6px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .primary {
      background: var(--orange);
    }

    .secondary {
      background: var(--blue);
    }

    footer {
      display: flex;
      justify-content: center;
      gap: 18px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.74);
    }

    footer a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .hero-copy {
        padding: 24px;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="headline">
      <div class="hero-copy">
        <h1 id="headline">My Party Emissions</h1>
        <p>Wie hoch ist der CO2-Fußabdruck eines Partyabends? Der Rechner schätzt Emissionen und zeigt zusätzliche ökologische und soziale Auswirkungen verschiedener Substanzen.</p>
        <div class="authors">Presented by Paula & Eddy</div>
        <div class="actions">
          <a class="button primary" href="calculator.html">CO2-Rechner starten</a>
          <a class="button secondary" href="sources.html">Quellen ansehen</a>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <a href="sources.html">Quellen</a>
    <a href="impressum.html">Impressum</a>
  </footer>
</body>
</html>
